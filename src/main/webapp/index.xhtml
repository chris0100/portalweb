<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:f="http://xmlns.jcp.org/jsf/core">  
    <head jsf:id="head">
        <meta charset="utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <link rel="icon" type="image/png" href="#{request.contextPath}/resources/images/logoEkaIcon.png"/>
        <title>Eka Corporación S.A - Portal web</title>
        <meta name="description" content="Eka Corporación S.A - Portal web"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" href="#{request.contextPath}/resources/css/cs-skin-elastic.css"/>
        <link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css"/>
        <link href="#{request.contextPath}/resources/css/person.css" rel="stylesheet"/>
        <link href="#{request.contextPath}/resources/css/AdminLTE.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"/>
        <h:outputStylesheet library="css" name="font-awesome.min.css"/>
    </head>
<body class="bg-navy">
    <div class="sufee-login d-flex align-content-center flex-wrap">
        <div class="container">
            <div class="login-content">
                <div class="login-form form-group">
                    <div style="display:block">
                        <figure style="text-align: center">
                            <img class="align-content" width="80%" src="#{request.contextPath}/resources/images/logo.png" alt=""/>
                        </figure>
                    </div>
                    <div style="margin: 0 !important">
                        <p:messages id="messages" showDetail="true" closable="true">
                        </p:messages>
                    </div>
                    
                    
                    <!--Tab para ingreso de datos como cliente-->
                    <p:tabView dynamic="false" cache="false">
                        <p:tab title="Cliente">
                            <h:form>
                                
                                
                                
                                <!--Input para ingresar el nit del cliente-->
                                <div>
                                    <label style="color: black; font-weight: bold; text-transform: none; font-size: 1em"> Nit cliente:</label>
                                    <h:inputText id="user" 
                                                 class="form-control"
                                                 style="color: black; text-transform: none; font-size: 1em;"
                                                 value="#{loginController.nit}" 
                                                 required="true"
                                                 requiredMessage="Escribe el nit">
                                        <p:ajax listener="#{loginController.recargarSucursal}"/>   
                                        <f:ajax execute="@this" render="sucursal puntoEnvio"/>
                                    </h:inputText>
                                </div>
                                
                                
                                
                                <!--Campo dinamico para seleccionar la sucursal-->
                               <div style="margin-top: 5px" jsf:id="divPanel">
                                    <label style="color: black;font-weight: bold; text-transform: none; font-size: 1em"> Sucursal:</label>
                                    <p:selectOneMenu id="sucursal"
                                                     style="color: black; text-transform: none; font-size: 1em;width: 100%"
                                                     rendered="true"
                                                     filter="true"
                                                     filterMatchMode="contains"
                                                     autoWidth="false"
                                                     requiredMessage="Ingresar la sucursal"
                                                    value="#{loginController.sucursal}">
                                        <p:ajax listener="#{loginController.recargarPuntoEnvio}"/>  
                                        <f:ajax execute="@this" render="puntoEnvio"/>
                                        <f:selectItem itemValue="#{null}" itemLabel="Seleccionar una sucursal..." />
                                        <f:selectItems value="#{loginController.listaSucursal}" var="item" itemValue="#{item}"/>  
                                    </p:selectOneMenu>
                                </div>
                                
                                
                                
                                
                                <!--Campo dinamico para seleccionar el punto de envio-->
                                <div jsf:id="divPanel2">
                                    <label style="color: black;font-weight: bold; text-transform: none; font-size: 1em">Punto de envio:</label> 
                                    <p:selectOneMenu id="puntoEnvio"
                                                     style="color: black; text-transform: none; font-size: 1em;width: 100%"
                                                     required="true"
                                                     filter="true"
                                                     filterMatchMode="contains"
                                                     autoWidth="false"
                                                     rendered="true"
                                                     requiredMessage="Ingresar punto de envio"
                                                    value="#{loginController.puntoEnvio}">
                                        <f:selectItem itemValue="#{null}" itemLabel="Seleccionar un punto de envio..." />
                                        <f:selectItems value="#{loginController.listaPuntoEnvio}" var="item2" itemValue="#{item2}"/>  
                                    </p:selectOneMenu>
                                </div>
                                
                                
                                
                                
                                <!--Input para ingresar la contraseña-->
                               <div class="form-group">
                                    <label style="color: black; font-weight: bold;text-transform: none; font-size: 1em"> Contraseña:</label> 
                                    <h:inputSecret id="password"
                                                   style="color: black; text-transform: none; font-size: 1em;"
                                                   class="form-control"
                                                   value="#{loginController.password}" 
                                                   required="true"
                                                   requiredMessage="Escribir la contraseña"/>
                                    <span class="highlight"></span>
                                    <span class="bar"></span>
                                </div>
                                
                                
                                
                                <!--Boton para ingresar-->
                               <div class="form-group">
                                    <p:commandButton styleClass="boton-prime"
                                                     style="font-size: 1.1em !important"
                                                     value="Acceder"
                                                     process="@this"
                                                     ajax="false"
                                                     action="#{loginController.loginCliente}">
                                    </p:commandButton>
                                </div>
                                
                            </h:form>
                            
                            
                            <h:form>
                                <p:commandLink ajax="false" value="¿Contraseña olvidada?" class="link-login" action="#{usuarioController.prepareRecuperarPassword}"/>
                                <br></br>
                                <p:commandLink ajax="false" value="¿Necesitas ayuda?" class="link-login" action="#{loginController.prepareAyuda}"/>
                                <i style="color: #1a5493" class="fa fa-question-circle"></i>
                            </h:form>
                            
                        </p:tab>
                        
                        
                        
                        <!--Tab para el proveedor-->
                        <p:tab title="Proveedor">
                            <h:form>
                                
                                <!--Ingreso del nit del proveedor-->
                                <div>
                                    <label style="color: black; font-weight: bold; text-transform: none; font-size: 1em"> Nit proveedor:</label>
                                    <h:inputText id="user" 
                                                 class="form-control"
                                                 style="color: black; text-transform: none; font-size: 1em;"
                                                 value="#{loginController.nit}" 
                                                 required="true"
                                                 requiredMessage="Escribe el nit">
                                        <p:ajax listener="#{loginController.recargarSucursal}"/>   
                                        <f:ajax execute="@this" render="sucursal puntoEnvio"/>
                                    </h:inputText>
                                </div>
                                
                                <!--Ingreso de la contraseña del proveedor-->
                                <div class="form-group">
                                    <label style="color: black; font-weight: bold;text-transform: none; font-size: 1em;margin-top: 10px"> Contraseña:</label> 
                                    <h:inputSecret id="password"
                                                   style="color: black; text-transform: none; font-size: 1em;"
                                                   class="form-control"
                                                   value="#{loginController.password}" 
                                                   required="true"
                                                   requiredMessage="Escribir la contraseña"/>
                                    <span class="highlight"></span>
                                    <span class="bar"></span>
                                </div>
                                
                                <!--Boton para validar ingreso-->
                                <div class="form-group">
                                    <p:commandButton styleClass="boton-prime"
                                                     style="font-size: 1.1em !important"
                                                     value="Acceder"
                                                     process="@this"
                                                     ajax="false"
                                                     action="#{loginController.loginProveedor}">
                                    </p:commandButton>
                                </div>
                            </h:form>
                            
                            <!--Formulario para recuperar contraseña-->
                             <h:form>
                                <p:commandLink ajax="false" value="¿Contraseña olvidada?" class="link-login" action="#{usuarioController.prepareRecuperarPassword}"/>
                                <br></br>
                                <p:commandLink ajax="false" value="¿Necesitas ayuda?" class="link-login" action="#{loginController.prepareAyuda}"/>
                                <i style="color: #1a5493" class="fa fa-question-circle"></i>
                            </h:form>
                            
                            
                        </p:tab>
                    </p:tabView>
                </div>
                
                
                <div style="text-align: center; padding: 0 !important">
                    Copyright &copy; 2020 Eka Corporación S.A.
                    <h:form style="padding: 0 !important">
                       <p:commandLink value="Términos y condiciones" style="color: white;font-size: 1em !important; font-weight: bold !important" oncomplete="PF('condiciones').show()" />
                    </h:form> 
                </div>
                
                <!--Ventana Modal-->
                <p:dialog widgetVar="condiciones"  position="center center" modal="true" width="900" height="500">
                    <ui:include src="/terminosCondiciones.xhtml" />
                </p:dialog>
                
            </div>
        </div>
    </div>
    <script type="text/javascript">
        if (#{loginController.authenticated}) {
            location.reload(true);
        window.location = "#{request.contextPath}/faces/usuario/dashboard.xhtml";
    }
</script>
</body>
</html>
