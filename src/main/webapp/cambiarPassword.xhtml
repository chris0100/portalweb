<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf"
      xmlns:fn="http://java.sun.com/jsp/jstl/functions">
    <ui:composition template="/template/template.xhtml">
        <ui:define name="title">
           Recuperar contraseña  
        </ui:define>
        <ui:define name="title2">
        </ui:define>
        <ui:define name="menu">
            <h:form id="menu-principal">
                <ul class="sidebar-menu">
                    <h:panelGroup>
                        <li style="margin-top: 20px">
                             
                        </li>
                    </h:panelGroup>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="body" >
            <div class="row">
                <div class="col-md-6" jsf:rendered="#{usuarioController.tokenActivo}">
                    <p></p>
                    <h:form>
                        <div class="form-group">        
                            <h:outputLabel value="Contraseña de ingreso:"  />   
                            <p:password class="form-control" id="contra1InputText" required="true" feedback="true"
                                                  requiredMessage="Por favor ingrese una contraseña"
                                                  value="#{usuarioController.usuarioActual.contrasena}" maxlength="10"
                                                  match="contra2InputText"
                                                  promptLabel="La contraseña debe contener mínimo 8 caracteres y máximo 10 caracteres también debe contener un numero y un carácter especial"
                                                  validatorMessage="La contraseña debe contener mínimo 8 caracteres y máximo 10 caracteres también debe contener un numero y un carácter especial" weakLabel="Baja" goodLabel="Media" strongLabel="Alta">
                                        <f:validateLength minimum="8" maximum="10"/>
                                        <f:validateRegex pattern="(?=^.{8,}$)(?=.*\d)(?=.*[!@#$%^&amp;*()_+}{&quot;:;'?/&gt;.&lt;,])(?!.*\s).*$" />
                            </p:password>
                            <p:message id="contra1Message" for="contra1InputText" />
                        </div>  
                        <div class="form-group">        
                            <h:outputLabel value="Repetir contraseña:"  />   
                            <p:password class="form-control" id="contra2InputText" required="true"
                                                  requiredMessage="Por favor ingrese una contraseña"
                                                  value="#{usuarioController.usuarioActual.contrasena}" maxlength="10"
                                                  validatorMessage="Las contraseñas no son iguales">
                            </p:password>
                            <p:message id="contra2Message" for="contra2InputText" />
                        </div>        
                        <div class="row">
                            <div class="col-sm-6 form-group">
                                <p:commandButton class="boton-prime"
                                        ajax="false"
                                        value="Guardar contraseña"
                                        action="#{usuarioController.updateUsuarioContrasenaRestablecida}"
                                        onclick="onSubmitButton();"/>
                            </div>
                        </div>
                    </h:form>  
                </div>
                <div class="col-md-4" jsf:rendered="#{!usuarioController.tokenActivo}">
                    error el link a expirado
                </div>
            </div>
            <script type="text/javascript">
                    if (#{loginController.authenticated}) {
                        location.reload(true);
                    window.location = "#{request.contextPath}/faces/usuario/dashboard.xhtml";
                }
            </script>
        </ui:define>
    </ui:composition>
</html>
